      - generic [ref=f2e1047]:
        - paragraph [ref=f2e1048]: 车辆基准：CLTC 751km，高速实际按 500–550km 估算；8月高温空调 + 戈壁侧风，按 -20~30% 预留；山区（禾木、果子沟、独库）电耗再 +15~30%。大海道非铺装段不以理论续航替代车机预测。
        - paragraph [ref=f2e1049]: 赶路日选站：正常主充优先同方向高速服务区，把补电、卫生间、吃饭和遛狗合并；城区站只作起点、落地，或服务区无法启动且余量不足/驾驶员疲劳时的安全退出。页面标注“高速内”的站点才属于正常赶路计划。
        - paragraph [ref=f2e1050]: 统一切换规则：预计排队超过20分钟、不可用桩超过一半、无法确认开放，或预测到站电量低于20%时，立即切换主备站。拥堵只换附近备选，不触发长距离绕行；只有连续关键站均不可确认且尚未进入风险路段，才在最后安全城市决定延迟或改线。
        - paragraph [ref=f2e1051]: 三条铁律：① 每晚睡前完成主站或备选站补能；② 无人区逢可用桩补电，任何时刻保有到达下一安全城镇或下下个已确认站的电量；③ 出发前24小时和最后安全决策点各核验一次，弱信号段提前截图。
