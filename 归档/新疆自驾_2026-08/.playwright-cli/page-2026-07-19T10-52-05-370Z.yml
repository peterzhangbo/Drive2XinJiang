        - list [ref=f2e921]:
          - listitem [ref=f2e922]: D9–D10 赛里木湖自驾套票：提前 3–7 天，旺季常约满，每日 10:00 放票准点抢；小程序「一部手机游赛湖」/公众号「赛里木湖旅游」，实名分时；未约会被劝返。
          - listitem [ref=f2e923]: D12 那拉提自驾：提前最多 7 日（每日 0:00–0:30 停票外可约）；小程序「智游那拉提」，线下窗口 2026 已全关；7 座及以下、定制自驾驾龄满 3 年。
