        - text: V25 当前执行版本：V25（2026-07-19）。去程D3不再绕金塔、酒泉，改由额济纳经G7—G215直连瓜州，G30只保留约72km；返程D19退出施工中的G315水上雅丹长廊，改走S318到格尔木，D20住茶卡，D21再到西宁；成都东行走G5013—G5001—G5021—G50，绕开暑期全封闭的G42谭家沟—二洞桥段。成都和武汉各留一整天休整并与朋友吃饭。推荐版共28天，其中18晚酒店/民宿、9晚床车。
