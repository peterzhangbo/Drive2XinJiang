      - heading "门票与预约速查" [level=2] [ref=f4e816]
      - paragraph [ref=f4e819]: 很多点是「现场买票即可」，但有5 个必须提前线上预约，约满或未约会被劝返/罚款——先看下面的预约时间线，再看逐点门票。宠物准入除禾木外多数景区无官方明文，需另行电话确认。
      - generic [ref=f4e820]:
        - text: ⏰ 必须提前预约（有抢票窗口 / 罚则）：
        - list [ref=f4e821]:
          - listitem [ref=f4e822]: D9–D10 赛里木湖自驾套票：提前 3–7 天，旺季常约满，每日 10:00 放票准点抢；小程序「一部手机游赛湖」/公众号「赛里木湖旅游」，实名分时；未约会被劝返。
          - listitem [ref=f4e823]: D12 那拉提自驾：提前最多 7 日（每日 0:00–0:30 停票外可约）；小程序「智游那拉提」，线下窗口 2026 已全关；7 座及以下、定制自驾驾龄满 3 年。
          - listitem [ref=f4e824]: D14 独库公路北段：提前 1–7 天选时段；小程序「游新疆一码游」/公众号「平安天山·新疆交警」；免费，未约直行罚 200 记 1 分，年内爽约>3 次取消当年资格；乔尔玛入口选 08:00–10:00。
          - listitem [ref=f4e825]: D11 库尔德宁自驾：提前 1–3 天或当天小程序预约（名额动态调控）；单向环线不可折返，务必先电话确认两只边牧可随车入园再约。
          - listitem [ref=f4e826]: D19 水上雅丹房车营地：营地提前数日预订（门票可当天）；官网/公众号/携程。
