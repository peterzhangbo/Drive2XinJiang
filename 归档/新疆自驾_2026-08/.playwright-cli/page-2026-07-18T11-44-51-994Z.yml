      - heading "这次规划的五条底层逻辑" [level=2] [ref=f4e756]
      - generic [ref=f4e759]:
        - paragraph [ref=f4e760]: 1. 「狗全程同行，交通方式逐项确认」——公共道路仍优先；禾木因用户已向相关方确认两只边牧可以带入村，恢复为正式行程。私家车停景区外，人与狗乘民宿提供的可载犬出租车进村（区间车为备选），执行前必须保存确认凭证并与司机落实接送时间和乘坐方式。
        - paragraph [ref=f4e761]: 2. 补能结论必须分证据等级——城市超充可以用运营商页面确认，但实时排队、故障和临时关闭只能在车机或运营商App核对。G7临白段与S240/S245都按风险路段管理：前者逐站复核，后者未找到主管部门或运营商对沿线充电投运的可靠确认，因此必须在敦煌完成双站备选和满电门槛后再进入。
        - paragraph [ref=f4e762]: 3. 8月戈壁段以避热和合法停车为先——大海道正午以车内休整为主；S21只在服务区或驶出高速后的合法地点停车，不在应急车道拍照。狗的户外时间尽量放在早10点前、晚7点后。
        - paragraph [ref=f4e763]: 4. 每晚落脚点都要电话二次确认——酒店平台「宠物友好」标签 ≠ 收两只边牧，停车免费也 ≠ 允许睡车。D1–D15与西宁/成都/武汉三晚酒店确认两只边牧、停车和晚到保留；其余8个床车夜另确认普通小客车过夜、厕所、管理、夜间出入和最近快充。未确认就改住正规住宿。
        - paragraph [ref=f4e764]: 5. 延误吃景点、不吃住宿序列——27天住宿日期咬死、没有整段缓冲：所有酒店尽量订可免费取消，妻子D16机票买可改签；任何一天落后就砍当天景点保住宿，D12（那拉提）、D15（乌鲁木齐）、D23（成都）、D26（武汉）四个轻量日可临时压缩用来追回进度；D27不强求当日到家。
      - heading "为狗设计的核心取舍" [level=2] [ref=f4e765]
      - list [ref=f4e769]:
        - listitem [ref=f4e770]: 🐕 狗不去＝我们不去：喀纳斯主湖、天池、巴音布鲁克等禁宠景区全部放弃（归档在「不得不错过」），不做任何寄养妥协。
        - listitem [ref=f4e771]: 🛣️ 玩公路而非景区：S240/S245、大海道哈密端、S21、唐布拉百里画廊、独库北段——这些是狗能同行、又出片的公开道路景观；每段的行/充/停细节看逐日卡片。
        - listitem [ref=f4e772]: 🎫 条件模块看确认：禾木、赛里木湖、库尔德宁、那拉提购票区都以「两只边牧获准同行」为前提，未确认即改公开道路替代；仙女湖不是驾车直达点，默认不安排骑马/陡坡徒步。
        - listitem [ref=f4e773]: 🌡️ 避热为先：8月戈壁/吐鲁番酷热，去阿勒泰走G7北线绕开吐鲁番；狗户外只放早10点前、晚7点后，正午车内休整。
