      - heading "💡 这次规划的四条底层逻辑" [level=2] [ref=e122]
      - generic [ref=e123]:
        - paragraph [ref=e124]: 1. 「区间车 ≈ 禁狗，自驾进 ≈ 狗友好」——这一条规律解释了新疆 90% 景区的宠物政策。所以行程把权重全部压在可自驾进入的地方：赛里木湖环湖公路、江布拉克、独库公路、唐布拉百里画廊、禾木（凭民宿订单申请自驾进村）。喀纳斯主湖、天山天池、巴音布鲁克九曲明确禁宠，已全部移出行程——狗不去的地方我们也不去，归档见「🗄️ 不得不错过」页，留给未来不带狗的旅行。
        - paragraph [ref=e125]: 2. 电车走新疆已经不是冒险——新疆 105 对高速服务区充电全覆盖，赛里木湖东门有 24 个快充桩（含特斯拉），独库公路沿线桩距<100km。唯一硬风险是去程 G7 临白段 930km 无人区：策略是「满电进、逢桩必充、保留到达下下站的电量」，并准备 G30 绕行预案。
        - paragraph [ref=e126]: 3. 8月 = 避热跑北线——行程刻意绕开吐鲁番/沙漠白天活动，把狗的户外时间放在早10点前、晚7点后（新疆9点半才天黑）；睡车两晚都选在海拔 1700m+ 的凉爽营地，露营模式整夜空调只耗 10–20 度电。
        - paragraph [ref=e127]: 4. 每晚住宿都要电话二次确认——平台「宠物友好」标签 ≠ 收两只边牧（很多只收小型犬）。打电话时报「两只边境牧羊犬、约 15-20kg、不拆家、自备垫子」，把疫苗本拍照发过去，成功率大增。
      - heading "⭐ 行程高光（为狗设计的）" [level=2] [ref=e128]
      - list [ref=e130]:
        - listitem [ref=e131]: 🏆 赛里木湖自驾环湖 + 营地睡车：买自驾票开进环湖公路，南岸无名草坡=雪山+湖水+边牧狂奔；24小时票可看日落+日出两轮（D10-11）
        - listitem [ref=e132]: 🥈 独库公路北段 + 唐布拉百里画廊：全程免费自驾，垭口雪山、云杉峡谷、喀什河草甸随停随玩（D12-13）
        - listitem [ref=e133]: 🥉 江布拉克麦浪睡车夜：明确「可自驾+可带宠+可露营」的景区，万亩麦浪配天山雪峰，夜里银河肉眼可见（D5）
        - listitem [ref=e134]: 🌲 禾木自驾进村：凭民宿订单在「原行网」小程序申请自驾进村，带狗看晨雾炊烟——办成了就是全程高光（D8-9）
        - listitem [ref=e135]: 🐕 可选模块：仅剩安集海大峡谷（D14顺路50分钟，免费）；喀纳斯/天池等禁宠景区已全部移出，归档见「🗄️ 不得不错过」页
