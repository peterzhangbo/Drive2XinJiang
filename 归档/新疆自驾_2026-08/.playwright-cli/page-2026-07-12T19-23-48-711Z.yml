      - generic [ref=e35]:
        - text: 🔍 2026-07-11 全网核查更新（出行前必读，已发现多处与原方案不符）：
        - list [ref=e36]:
          - listitem [ref=e37]: 独库公路北段新增预约制：2026年6月25日-8月31日，乌苏驿—乔尔玛—那拉提段（D13途经）每日限流约3000辆，需提前1-7天线上预约（渠道名以当季公告为准：「游新疆一码游」「平安独库」小程序/「平安天山」「新疆交警」公众号均有入口），否则无法进入；实际通行时间为乌苏驿-库如力段每日8:00-19:00（此前文档写的21:00-09:00禁行口径不准确），库如力—那拉提入口段视流量可弹性延至21:00——D13早出发、18:00前出山
          - listitem [ref=e38]: 禾木自驾进村（二次复核已找到现行流程）：本地宝2025年10月口径——自驾进村在禾木游客服务中心（或72公里售票处）现场通过「原行网」小程序申请，材料：村内住宿订单+车牌+身份证+驾驶证，获批后车只能停民宿指定区域；未获批则停游客中心停车场换免费区间车（区间车不带狗）。名额与审核口径随季节变动，务必提前请所订民宿协助确认当日名额；门票60/人，区间车往返100/人（获批自驾可免）
          - listitem [ref=e39]: D9 乌尔禾住宿信息不符：「和一丽呈华廷酒店」携程当前门店名为「(世界魔鬼城店)」而非「(温泉)」，页面未见宠物友好/特斯拉超充标签，三项特色均需电话重新确认
          - listitem [ref=e40]: 边防证已电子化：自2026年4月15日起可用「移民局12367」App/小程序几十秒办好电子证，不必只依赖布尔津现场窗口
          - listitem [ref=e41]: 动物检疫合格证明已无纸化：全国自2025年起推行电子出证，有效期最长5天（非"3-5天"模糊表述），建议提前3天线上申报+预约现场查验，而非"到监督所办理"
          - listitem [ref=e42]: 价格/时间更正：江布拉克门票旺季55元/淡季25元（2025年7月起，非43元），区间车往返30元；世界魔鬼城总价62元=门票42+区间小火车20（不是62+20），2026年6月起营业时间延长为08:30-21:00；喀纳斯门票160元/人+区间车另计〔以景区小程序为准〕；赛里木湖环湖自驾为按人头套票145元/人（门票70+自驾费75，24h有效；两日票190）；点将台营位（自带车/帐篷）物价备案约200-400元/晚含水电，星空房/房车房约800-1280元起——两类别混淆过，订时说清「自带床车要营位」
          - listitem [ref=e43]: 赛湖露营风险：2025年8月15日景区曾突然关闭全部露营区及预约通道，2026年8月中旬出行正撞同一时间窗——D10睡车夜出发前一周致电400-0919188确认；若关闭改住博乐希尔顿惠庭（北京南路6号）
          - listitem [ref=e44]: 额济纳更正：胡杨林旅游区为季节性开园（往年9月上旬开园，8月未开园且叶是绿的）；D2/D16改看居延海（门票60+观光车10，常年开放，日出芦苇+鸥鸟）与路边免费胡杨
          - listitem [ref=e45]: 充电设施整体改善：赛里木湖东门新增「顺顺充」华为600kW液冷超充站；独库公路那拉提/独山子两端已升级为超充，仅巴音布鲁克营地仍为20kW慢充；G7临白段服务区内蒙古计划2026年内全覆盖，但暂无近期实测故障数据，仍需App实时核查
