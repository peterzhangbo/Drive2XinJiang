                - listitem [ref=e684]: 06:30左右离开蜜蜂小镇，目标08:00前后回到乔尔玛并按预约入口核验；2026社会车辆北段主要通行时段为08:00–19:00，19:00后不再驶入
                - listitem [ref=e685]: 只在官方停车区短停哈希勒根达坂、融雪瀑布和峡谷森林等景观；“老虎口”“守望天山”等网络点名不作为必须停车任务，现场禁停就直接通过
                - listitem [ref=e686]: 垭口海拔高、气温低，两只狗短时下车、穿防风层并避免奔跑；落石路段不下车
