            - generic [ref=e672]: 📍 蜜蜂小镇—S315返回乔尔玛—G217哈希勒根达坂—毛溜沟/乌苏驿方向—独山子—G30—乌鲁木齐
            - generic [ref=e673]: 今日决策：未预约乔尔玛入口08:00–10:00时段、独库未开放、遇雨雪/落石，或唐布拉出发预测到独山子低于20% → 不进入独库；按交警和车机给出的G218/G30替代路线执行。若15:30仍未抵达独山子，取消沿途非必要停留，避免把G30转场拖至深夜。
            - generic [ref=e674]:
              - generic [ref=e675]: ⚡ 充电 & 行车
              - list [ref=e676]:
                - listitem [ref=e677]: D13夜间在听泉别院或蜜蜂小镇公共桩充至90%以上；出发前再次核对车机预测
                - listitem [ref=e678]: 毛溜沟服务区已有充电设施官方线索，只作应急备选A，不把单一山中站当主计划
                - listitem [ref=e679]: 抵达独山子后选择实时公共快充为主站；不可用即切奎屯城区不同运营商公共快充为备选B
                - listitem [ref=e680]: 独山子/奎屯补至能抵达乌鲁木齐且保留20%以上；乌鲁木齐万科生活广场特斯拉超充为落地备选
