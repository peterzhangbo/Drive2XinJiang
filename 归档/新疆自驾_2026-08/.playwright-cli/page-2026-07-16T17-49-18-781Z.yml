      - heading "💡 这次规划的四条底层逻辑" [level=2] [ref=e122]
      - generic [ref=e123]:
        - paragraph [ref=e124]: 1. 「狗全程同行，交通方式逐项确认」——公共道路仍优先；禾木因用户已向相关方确认两只边牧可以带入村，恢复为正式行程。私家车停景区外，人与狗换乘区间车，执行前必须保存确认凭证并落实狗乘坐客舱、行李舱或笼具的具体方式。
        - paragraph [ref=e125]: 2. 补能结论必须分证据等级——城市超充可以用运营商页面确认，但实时排队、故障和临时关闭只能在车机或运营商App核对。G7临白段与S240/S245都按风险路段管理：前者逐站复核，后者未找到主管部门或运营商对沿线充电投运的可靠确认，因此必须在敦煌完成双站备选和满电门槛后再进入。
        - paragraph [ref=e126]: 3. 8月戈壁段以避热和合法停车为先——大海道正午以车内休整为主；S21只在服务区或驶出高速后的合法地点停车，不在应急车道拍照。狗的户外时间尽量放在早10点前、晚7点后。
        - paragraph [ref=e127]: 4. 每晚住宿都要电话二次确认——平台「宠物友好」标签 ≠ 收两只边牧（很多只收小型犬）。打电话时报「两只边境牧羊犬、约 15-20kg、不拆家、自备垫子」，把疫苗本拍照发过去，成功率大增。
      - heading "⭐ 行程高光（为狗设计的）" [level=2] [ref=e128]
      - list [ref=e130]:
        - listitem [ref=e131]: 🛣️ S240＋S245 敦煌—哈密经典公路：D4完整行驶，两条主线合计约351km；官方可确认通车和收费，但未确认沿线可靠充电，按敦煌满电进入、哈密双站到达补能执行
        - listitem [ref=e132]: 🏜️ 大海道全程穿越：D5从哈密东门进入、北门驶出后住鄯善；通天洞列为核心目标，但只有景区当天确认主线开放且Model Y低底盘可安全通行时才执行全穿越
        - listitem [ref=e133]: 🛣️ S21阿乌高速＋乌伦古湖：D6完整行驶后继续到阿勒泰市，克拉美丽服务区为主补能，五家渠与吉利湖为备选；只在服务区或合法驶出高速后观景
        - listitem [ref=e134]: 🌲 禾木住一晚：D7布尔津补足电后进禾木，D8看晨雾日出后取车，经布尔津补电直达乌尔禾；两只边牧可入村为用户已确认事项
        - listitem [ref=e135]: 🏆 赛里木湖东门进、南门出：D9住东门外，D10一早按景区当天导向环湖，南门出后经果子沟、霍城薰衣草园到伊宁；只在指定停车区下车
        - listitem [ref=e136]: 🥈 那拉提 + 唐布拉 + 独库北段：D12用一整天游那拉提，D13沿乔尔玛转入S315深玩唐布拉并住蜜蜂小镇，D14清晨返回乔尔玛后翻越哈希勒根达坂到独山子
        - listitem [ref=e137]: 🐕 可选模块：库尔德宁、那拉提购票区和唐布拉支线都以“两只边牧获准同行”为前提；仙女湖不是驾车直达点，本次默认不安排骑马或长距离陡坡徒步
